<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Учёт выработки</title>
    <link rel="manifest" href="manifest.json">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            padding: 15px;
            color: #333;
        }
        h1 {
            text-align: center;
            font-size: 20px;
            margin-bottom: 15px;
            color: #1a73e8;
        }
        .employee {
            background: white;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .employee h2 {
            font-size: 18px;
            margin-bottom: 10px;
            color: #333;
        }
        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .row label {
            flex: 1;
            font-size: 14px;
        }
        .row input {
            width: 70px;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            text-align: center;
        }
        .result {
            font-weight: bold;
            color: #1a73e8;
            font-size: 16px;
            text-align: right;
            margin-top: 5px;
        }
        .grand-total {
            background: #1a73e8;
            color: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            margin-top: 10px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            margin-top: 15px;
            cursor: pointer;
        }
        .btn:active {
            background: #a71d2a;
        }
    </style>
</head>
<body>

<h1>📊 Учёт выработки</h1>

<div id="app">
    <div class="employee">
        <h2>👤 Ира</h2>
        <div class="row">
            <label>Стандарт (×130)</label>
            <input type="number" id="ira_std" min="0">
        </div>
        <div class="row">
            <label>Передовик (×160)</label>
            <input type="number" id="ira_adv" min="0">
        </div>
        <div class="result">Сумма: <span id="ira_sum">0</span> ₽</div>
    </div>

    <div class="employee">
        <h2>👤 Т.Чинаева</h2>
        <div class="row">
            <label>Стандарт (×130)</label>
            <input type="number" id="china_std" min="0">
        </div>
        <div class="row">
            <label>Передовик (×160)</label>
            <input type="number" id="china_adv" min="0">
        </div>
        <div class="result">Сумма: <span id="china_sum">0</span> ₽</div>
    </div>

    <div class="employee">
        <h2>👤 Т.Яковлева</h2>
        <div class="row">
            <label>Стандарт (×130)</label>
            <input type="number" id="yak_std" min="0">
        </div>
        <div class="row">
            <label>Передовик (×160)</label>
            <input type="number" id="yak_adv" min="0">
        </div>
        <div class="result">Сумма: <span id="yak_sum">0</span> ₽</div>
    </div>

    <div class="grand-total">
        ИТОГО: <span id="total_sum">0</span> ₽
    </div>

    <button class="btn" onclick="resetData()">🗑 Сбросить</button>
</div>

<script>
    const RATE_STD = 130;
    const RATE_ADV = 160;

    const inputs = {
        ira_std: document.getElementById('ira_std'),
        ira_adv: document.getElementById('ira_adv'),
        china_std: document.getElementById('china_std'),
        china_adv: document.getElementById('china_adv'),
        yak_std: document.getElementById('yak_std'),
        yak_adv: document.getElementById('yak_adv')
    };

    function calculate() {
        const iraStd = parseInt(inputs.ira_std.value) || 0;
        const iraAdv = parseInt(inputs.ira_adv.value) || 0;
        const iraSum = iraStd * RATE_STD + iraAdv * RATE_ADV;
        document.getElementById('ira_sum').textContent = iraSum;

        const chinaStd = parseInt(inputs.china_std.value) || 0;
        const chinaAdv = parseInt(inputs.china_adv.value) || 0;
        const chinaSum = chinaStd * RATE_STD + chinaAdv * RATE_ADV;
        document.getElementById('china_sum').textContent = chinaSum;

        const yakStd = parseInt(inputs.yak_std.value) || 0;
        const yakAdv = parseInt(inputs.yak_adv.value) || 0;
        const yakSum = yakStd * RATE_STD + yakAdv * RATE_ADV;
        document.getElementById('yak_sum').textContent = yakSum;

        const total = iraSum + chinaSum + yakSum;
        document.getElementById('total_sum').textContent = total;
    }

    function resetData() {
        if (confirm('Точно сбросить все данные?')) {
            for (const key in inputs) {
                inputs[key].value = '';
            }
            calculate();
        }
    }

    for (const key in inputs) {
        inputs[key].addEventListener('input', calculate);
    }
</script>

</body>
</html>
